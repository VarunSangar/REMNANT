<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REMNANT // Dream Reconstruction Engine</title>
    <style>
        :root {
            --bg-space: #06060c;
            --bg-card: rgba(13, 13, 25, 0.7);
            --border-glow: rgba(100, 150, 255, 0.2);
            --text-primary: #e2e8f0;
            --text-muted: #8a99ad;
            --accent-cyan: #00f2fe;
            --accent-purple: #4facfe;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-space);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 10;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-glow);
            background: linear-gradient(to bottom, rgba(6,6,12,0.9), rgba(6,6,12,0));
        }

        header h1 {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            letter-spacing: 0.5rem;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            margin-top: 0.5rem;
        }

        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            height: fit-content;
        }

        .panel-title {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: var(--text-muted);
        }

        input, textarea, select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            background: rgba(255, 255, 255, 0.07);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.2));
            border: 1px solid var(--accent-cyan);
            color: var(--text-primary);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            font-size: 0.85rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.4), rgba(0, 242, 254, 0.4));
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            letter-spacing: 0.2rem;
        }

        /* Visualization Area */
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .canvas-container {
            position: relative;
            background: rgba(5, 5, 10, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            height: 550px;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        #dream-map {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #dream-map:active {
            cursor: grabbing;
        }

        /* Interpretation UI */
        .interpretation-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 1.5rem;
            display: none; /* Revealed dynamically */
            animation: fadeIn 1s ease forwards;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }

        .analysis-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 1rem;
        }

        .analysis-box h4 {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-purple);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1rem;
        }

        .analysis-box p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 4px;
            color: var(--accent-cyan);
            font-family: var(--font-mono);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .instructions {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>
        <h1>REMNANT</h1>
        <p>Subconscious Semantic Clustering Engine</p>
    </header>

    <main>
        <section class="panel">
            <h2 class="panel-title">// Ingest Fragment</h2>
            
            <form id="dream-form" onsubmit="handleDreamSubmit(event)">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="dream-text">Narrative Fragment</label>
                    <textarea id="dream-text" placeholder="Describe a scene, memory loop, or fleeting sensation..." required></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="dream-emotion">Dominant Core Emotion</label>
                    <select id="dream-emotion">
                        <option value="Melancholy">Melancholy (Deep Blue)</option>
                        <option value="Anxiety">Anxiety (Crimson Static)</option>
                        <option value="Euphoria">Euphoria (Neon Gold)</option>
                        <option value="Serenity">Serenity (Ethereal Emerald)</option>
                        <option value="Confusion">Confusion (Amethyst Mist)</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="dream-symbols">Key Archetypes / Symbols</label>
                    <input type="text" id="dream-symbols" placeholder="e.g., water, endless stairs, clock, shadow" required>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="dream-entities">Encountered Entities / People</label>
                    <input type="text" id="dream-entities" placeholder="e.g., the stranger, mother, faceless guide">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="dream-setting">Anomalous Landscape / Location</label>
                    <input type="text" id="dream-setting" placeholder="e.g., sunken city, brutalist desert, neon maze">
                </div>

                <button type="submit" class="btn-submit" style="width: 100%;">Map Consciousness</button>
            </form>
        </section>

        <section class="workspace">
            <div class="canvas-container">
                <canvas id="dream-map"></canvas>
                <div class="instructions">// Drag to pan / Scroll to zoom engine map</div>
            </div>

            <div class="interpretation-panel" id="interpretation">
                <h3 class="panel-title">// Subconscious Interpretation Analysis</h3>
                <div class="analysis-grid">
                    <div class="analysis-box">
                        <h4>Clustered Narrative Axis</h4>
                        <p id="analysis-narrative">Awaiting secondary nodes to construct archetypal vector alignment.</p>
                    </div>
                    <div class="analysis-box">
                        <h4>Recurring Symbol Anchors</h4>
                        <div class="tag-container" id="analysis-tags"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- AMBIENT PARTICLES SYSTEM ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        class AmbientParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > bgCanvas.width || this.y < 0 || this.y > bgCanvas.height) {
                    this.reset();
                }
            }
            draw() {
                bgCtx.fillStyle = `rgba(100, 150, 255, ${this.alpha})`;
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
        }

        for(let i=0; i<60; i++) particles.push(new AmbientParticle());

        function animateAmbient() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateAmbient);
        }
        animateAmbient();


        // --- MAIN GRAPH ENGINE (NEURAL NETWORK INTERACTIVE MAP) ---
        const mapCanvas = document.getElementById('dream-map');
        const ctx = mapCanvas.getContext('2d');

        let nodes = [];
        let links = [];
        let transform = { x: 0, y: 0, scale: 1 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        const EmotionConfig = {
            Melancholy: { color: '#4facfe', glow: 'rgba(79, 172, 254, 0.6)' },
            Anxiety: { color: '#ff4b5c', glow: 'rgba(255, 75, 92, 0.6)' },
            Euphoria: { color: '#ffd700', glow: 'rgba(255, 215, 0, 0.6)' },
            Serenity: { color: '#00f2fe', glow: 'rgba(0, 242, 254, 0.6)' },
            Confusion: { color: '#b57bee', glow: 'rgba(181, 123, 238, 0.6)' }
        };

        // Populate baseline nodes for semantic architecture simulation
        const initialSeeds = [
            { id: 'ego', label: 'EGO ANCHOR', type: 'Core', emotion: 'Serenity', x: 0, y: 0 },
            { id: 'shadow', label: 'THE SHADOW', type: 'Archetype', emotion: 'Confusion', x: -150, y: -100 },
            { id: 'anima', label: 'COLLECTIVE UNCONSCIOUS', type: 'Archetype', emotion: 'Melancholy', x: 180, y: 120 }
        ];

        initialSeeds.forEach(s => nodes.push(createNode(s.id, s.label, s.type, s.emotion, s.x, s.y)));
        links.push({ source: 'ego', target: 'shadow' }, { source: 'ego', target: 'anima' });

        function createNode(id, label, type, emotion, xOffset = 0, yOffset = 0) {
            return {
                id,
                label,
                type,
                emotion,
                x: mapCanvas.width / 2 + xOffset,
                y: mapCanvas.height / 2 + yOffset,
                vx: 0,
                vy: 0,
                radius: type === 'Core' ? 14 : 9,
                pulse: Math.random() * Math.PI
            };
        }

        function resizeMapCanvas() {
            const rect = mapCanvas.parentElement.getBoundingClientRect();
            mapCanvas.width = rect.width;
            mapCanvas.height = rect.height;
            // Center camera context safely post-render
            if(transform.x === 0 && transform.y === 0) {
                transform.x = 0;
                transform.y = 0;
            }
        }
        window.addEventListener('resize', resizeMapCanvas);
        resizeMapCanvas();

        // Physics engine loop simulating semantic clustering alignment forces
        function updatePhysics() {
            const k = 0.04; // Spring constant
            const repulsion = 400;

            // Node-to-node repulsion
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[j].x - nodes[i].x;
                    let dy = nodes[j].y - nodes[i].y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    if (dist < 220) {
                        let force = (repulsion / (dist * dist));
                        let fx = (dx / dist) * force;
                        let fy = (dy / dist) * force;
                        nodes[i].vx -= fx;
                        nodes[i].vy -= fy;
                        nodes[j].vx += fx;
                        nodes[j].vy += fy;
                    }
                }
            }

            // Hooke's Law links tension attractions
            links.forEach(link => {
                let s = nodes.find(n => n.id === link.source);
                let t = nodes.find(n => n.id === link.target);
                if (!s || !t) return;
                let dx = t.x - s.x;
                let dy = t.y - s.y;
                let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                let desiredDist = 130;
                let force = (dist - desiredDist) * k;
                let fx = (dx / dist) * force;
                let fy = (dy / dist) * force;
                s.vx += fx;
                s.vy += fy;
                t.vx -= fx;
                t.vy -= fy;
            });

            // Apply updates & friction damping dampers
            nodes.forEach(n => {
                n.vx *= 0.85;
                n.vy *= 0.85;
                n.x += n.vx;
                n.y += n.vy;
                n.pulse += 0.02;
            });
        }

        function drawGraph() {
            ctx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
            ctx.save();
            // Vector Zoom & Translate Transformation Matrix Matrix
            ctx.translate(mapCanvas.width/2 + transform.x, mapCanvas.height/2 + transform.y);
            ctx.scale(transform.scale, transform.scale);
            ctx.translate(-mapCanvas.width/2, -mapCanvas.height/2);

            // Structural Grid Lines Mapping Background Projection
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const gridSpacing = 40;
            for(let x = -1000; x < mapCanvas.width + 1000; x += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(x, -1000); ctx.lineTo(x, mapCanvas.height + 1000); ctx.stroke();
            }
            for(let y = -1000; y < mapCanvas.height + 1000; y += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(-1000, y); ctx.lineTo(mapCanvas.width + 1000, y); ctx.stroke();
            }

            // Draw Links Connective Network Synapses
            links.forEach(link => {
                let s = nodes.find(n => n.id === link.source);
                let t = nodes.find(n => n.id === link.target);
                if (!s || !t) return;

                let grad = ctx.createLinearGradient(s.x, s.y, t.x, t.y);
                grad.addColorStop(0, EmotionConfig[s.emotion]?.color || '#ffffff');
                grad.addColorStop(1, EmotionConfig[t.emotion]?.color || '#ffffff');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.35;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(t.x, t.y);
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            });

            // Draw Nodes Interactive Subconscious Targets
            nodes.forEach(n => {
                const config = EmotionConfig[n.emotion] || { color: '#fff', glow: 'rgba(255,255,255,0.5)' };
                const dynamicRadius = n.radius + Math.sin(n.pulse) * 1.5;

                ctx.shadowBlur = 15;
                ctx.shadowColor = config.color;

                // Outer Atmosphere
                ctx.fillStyle = config.color;
                ctx.globalAlpha = 0.15;
                ctx.beginPath();
                ctx.arc(n.x, n.y, dynamicRadius * 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Core Node Point
                ctx.globalAlpha = 1.0;
                ctx.beginPath();
                ctx.arc(n.x, n.y, dynamicRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0; // Reset canvas shadows performance pass

                // Node Labels Typography
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.font = `9px ${getComputedStyle(document.body).getPropertyValue('--font-mono')}`;
                ctx.textAlign = 'center';
                ctx.fillText(n.label.toUpperCase(), n.x, n.y - dynamicRadius - 8);

                ctx.fillStyle = varColor('--text-muted');
                ctx.font = '7px sans-serif';
                ctx.fillText(n.type.toUpperCase(), n.x, n.y + dynamicRadius + 12);
            });

            ctx.restore();
        }

        function varColor(varName) {
            return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        }

        function renderLoop() {
            updatePhysics();
            drawGraph();
            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        // --- INTERACTIVE NAVIGATION (PAN & ZOOM MOUSE ENGINE) ---
        mapCanvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart.x = e.clientX - transform.x;
            dragStart.y = e.clientY - transform.y;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            transform.x = e.clientX - dragStart.x;
            transform.y = e.clientY - dragStart.y;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        mapCanvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.05;
            if (e.deltaY < 0) {
                transform.scale = Math.min(transform.scale + zoomIntensity, 2.5);
            } else {
                transform.scale = Math.max(transform.scale - zoomIntensity, 0.5);
            }
        }, { passive: false });


        // --- FORM SUBMISSION & SEMANTIC CLUSTERING ENGINE PIPELINE ---
        let uniqueIdCounter = 0;
        let trackedSymbols = new Set(['archetype', 'liminality', 'subconscious']);

        function handleDreamSubmit(event) {
            event.preventDefault();

            const text = document.getElementById('dream-text').value;
            const emotion = document.getElementById('dream-emotion').value;
            const symbols = document.getElementById('dream-symbols').value.split(',');
            const entities = document.getElementById('dream-entities').value.split(',');
            const setting = document.getElementById('dream-setting').value;

            const batchId = `fragment_${uniqueIdCounter++}`;
            
            // Random positional distribution slightly offset to invoke cinematic introduction alignment velocity
            const angle = Math.random() * Math.PI * 2;
            const radiusOffset = 140;
            const spawnX = Math.cos(angle) * radiusOffset;
            const spawnY = Math.sin(angle) * radiusOffset;

            // Step 1: Inject Main Fragment Root Node
            const coreLabel = text.length > 18 ? text.substring(0, 15) + '...' : text;
            const primaryNode = createNode(batchId, coreLabel, 'Fragment', emotion, spawnX, spawnY);
            nodes.push(primaryNode);

            // Connect automatically to structural root Anchor
            links.push({ source: 'ego', target: batchId });

            // Step 2: Extract & Cluster Secondary Attribute Nodes (Symbols, Entities, Context Elements)
            symbols.forEach((sym, idx) => {
                const cleanSym = sym.trim().toLowerCase();
                if(!cleanSym) return;
                trackedSymbols.add(cleanSym);

                const symId = `sym_${cleanSym}`;
                if(!nodes.some(n => n.id === symId)) {
                    nodes.push(createNode(symId, cleanSym, 'Symbol', emotion, spawnX + (idx*20), spawnY - 40));
                }
                links.push({ source: batchId, target: symId });
            });

            if (setting && setting.trim() !== "") {
                const setClean = setting.trim();
                const setId = `set_${setClean.replace(/\s+/g, '_')}`;
                if(!nodes.some(n => n.id === setId)) {
                    nodes.push(createNode(setId, setClean, 'Landscape', emotion, spawnX - 50, spawnY + 50));
                }
                links.push({ source: batchId, target: setId });
            }

            // Step 3: Trigger Psychological Synthesizer AI Analysis Processing Display Engine
            displayInterpretation(emotion, text);
            
            // Reset input container form
            document.getElementById('dream-form').reset();
        }

        function displayInterpretation(lastEmotion, rawText) {
            const panel = document.getElementById('interpretation');
            const narrativeOutput = document.getElementById('analysis-narrative');
            const tagsContainer = document.getElementById('analysis-tags');

            panel.style.display = 'block';

            // Algorithmic psychological text formulation based on semantic state
            let archetypalReport = "";
            switch(lastEmotion) {
                case 'Melancholy':
                    archetypalReport = "The network displays a high density of retrocausal emotional patterns. Your mind is looping through past spatial structures, attempting to reconstruct processing models for missing semantic realities.";
                    break;
                case 'Anxiety':
                    archetypalReport = "High-frequency systemic static detected. The presence of fragmented elements indicates deep defensive boundaries within the semantic field. The subconscious is trying to secure an unmapped sector.";
                    break;
                case 'Euphoria':
                    archetypalReport = "Hyper-harmonic expansion observed. Nodes indicate unconstrained neuro-symbolic drift. Dream patterns are shedding cognitive filters, signaling deep processing resolution cycles.";
                    break;
                case 'Serenity':
                    archetypalReport = "Symmetrical semantic alignment confirmed. The configuration signifies an optimal integration cycle between structural memory matrices and your present conscious core layout.";
                    break;
                case 'Confusion':
                    archetypalReport = "Unresolved spatial metrics. The neural mapping suggests conflicting narrative trajectories. Multiple archetypal structures are competing for structural dominance over your dream network canvas.";
                    break;
            }

            narrativeOutput.innerText = archetypalReport;

            // Sync dynamic symbol tags array UI
            tagsContainer.innerHTML = '';
            Array.from(trackedSymbols).slice(-8).forEach(sym => {
                const tagEl = document.createElement('span');
                tagEl.className = 'tag';
                tagEl.innerText = `#${sym}`;
                tagsContainer.appendChild(tagEl);
            });
        }
    </script>
</body>
</html>
