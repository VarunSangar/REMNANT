<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REMNANT // Subconscious Reconstruction Engine</title>

<style>
:root {
    --bg: #02030a;
    --panel: rgba(8,10,20,0.82);
    --cyan: #00e5ff;
    --purple: #9b5cff;
    --red: #ff3b6b;
    --text: #d9e1ff;
    --muted: #66708a;
    --mono: "Courier New", monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: radial-gradient(circle at center, #06111f 0%, #02030a 60%);
    color: var(--text);
    font-family: Inter, sans-serif;
}

#dreamCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
}

.ui {
    position: relative;
    z-index: 5;
    width: 360px;
    height: 100vh;
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(25px);
    border-right: 1px solid rgba(255,255,255,0.08);
    padding: 28px;
}

.title {
    font-family: var(--mono);
    letter-spacing: 0.45rem;
    color: var(--cyan);
    font-size: 2rem;
}

.subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.18rem;
    text-transform: uppercase;
}

.section {
    margin-top: 28px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.72rem;
    letter-spacing: 0.15rem;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
}

textarea,
input,
select {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 14px;
    border-radius: 10px;
}

textarea {
    height: 120px;
    resize: none;
}

button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid rgba(0,229,255,0.5);
    background: linear-gradient(135deg, rgba(0,229,255,0.12), rgba(155,92,255,0.15));
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
    letter-spacing: 0.14rem;
    font-family: var(--mono);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(0,229,255,0.25);
}

.metrics {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.metric {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
}

.metric h3 {
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.1rem;
}

.metric p {
    font-size: 1.2rem;
    color: var(--cyan);
}

.analysis {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 520px;
    background: rgba(5,5,12,0.82);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    backdrop-filter: blur(25px);
    padding: 28px;
    z-index: 6;
}

.analysis-title {
    color: var(--cyan);
    font-family: var(--mono);
    letter-spacing: 0.2rem;
    margin-bottom: 16px;
}

#analysisText {
    line-height: 1.8;
    color: #c9d0e7;
}

.floatingLabel {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-family: var(--mono);
    font-size: 0.75rem;
    pointer-events: none;
    text-shadow: 0 0 12px currentColor;
}
</style>
</head>
<body>

<canvas id="dreamCanvas"></canvas>

<div class="ui">
    <div class="title">REMNANT</div>
    <div class="subtitle">Subconscious Reconstruction Engine</div>

    <div class="section">
        <label>Narrative Fragment</label>
        <textarea id="narrative">I was walking through a flooded hallway while giant clocks floated above black water. A faceless figure watched me from the ceiling.</textarea>
    </div>

    <div class="section">
        <label>Dominant Emotion</label>
        <select id="emotion">
            <option>Melancholy</option>
            <option>Anxiety</option>
            <option>Euphoria</option>
            <option>Serenity</option>
        </select>
    </div>

    <div class="section">
        <label>Symbols</label>
        <input id="symbols" value="clock, water, hallway, faceless figure, ceiling" />
    </div>

    <button onclick="reconstructDream()">RECONSTRUCT DREAM</button>

    <div class="metrics">
        <div class="metric">
            <h3>Dream Coherence</h3>
            <p id="coherence">0.00</p>
        </div>

        <div class="metric">
            <h3>Semantic Density</h3>
            <p id="density">0.00</p>
        </div>

        <div class="metric">
            <h3>Archetype</h3>
            <p id="archetype">NULL</p>
        </div>

        <div class="metric">
            <h3>Instability</h3>
            <p id="instability">0%</p>
        </div>
    </div>
</div>

<div class="analysis">
    <div class="analysis-title">// SUBCONSCIOUS INTERPRETATION</div>
    <div id="analysisText">
        Awaiting subconscious reconstruction.
    </div>
</div>

<script>
const canvas = document.getElementById('dreamCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener('resize', resize);

let particles = [];
let dreamObjects = [];
let fogOffset = 0;

const SymbolWeights = {
    clock: 0.91,
    mirror: 0.88,
    shadow: 0.95,
    water: 0.83,
    hallway: 0.71,
    staircase: 0.76,
    faceless: 0.94,
    eye: 0.81,
    ceiling: 0.67,
    ocean: 0.79
};

function semanticDensity(symbols) {
    let score = 0;

    symbols.forEach(s => {
        const clean = s.trim().toLowerCase();
        score += SymbolWeights[clean] || 0.45;
    });

    return Math.min(1, score / symbols.length);
}

function dreamCoherence(text, symbols) {
    let score = 0.42;

    if(text.length > 80) score += 0.18;
    if(symbols.length > 3) score += 0.14;

    const narrativeTerms = [
        'running','floating','watching','falling',
        'water','dark','hallway','voice','mirror'
    ];

    narrativeTerms.forEach(term => {
        if(text.toLowerCase().includes(term)) {
            score += 0.03;
        }
    });

    return Math.min(1, score);
}

function inferArchetype(symbols, emotion) {
    const joined = symbols.join(' ').toLowerCase();

    if(joined.includes('clock')) return 'Temporal Anxiety';
    if(joined.includes('water')) return 'Emotional Descent';
    if(joined.includes('mirror')) return 'Identity Fragmentation';
    if(joined.includes('faceless')) return 'Observer Entity';

    if(emotion === 'Euphoria') return 'Boundary Dissolution';

    return 'Subconscious Drift';
}

class Particle {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.r = Math.random() * 2.5;
        this.speed = Math.random() * 0.5 + 0.2;
        this.alpha = Math.random() * 0.6;
    }

    update(color) {
        this.y -= this.speed;

        if(this.y < 0) {
            this.y = canvas.height;
        }

        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.globalAlpha = this.alpha;
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class DreamObject {
    constructor(type, emotion) {
        this.type = type;
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 120 + 50;
        this.rotation = Math.random() * Math.PI;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.emotion = emotion;
        this.seed = Math.random() * 1000;
    }

    draw(t) {
        this.x += this.vx;
        this.y += this.vy;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation + Math.sin(t * 0.0002 + this.seed) * 0.2);

        const pulse = Math.sin(t * 0.001 + this.seed) * 20;

        if(this.type.includes('clock')) {
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#00e5ff';

            ctx.beginPath();
            ctx.arc(0,0,this.size * 0.35 + pulse * 0.05,0,Math.PI*2);
            ctx.stroke();

            for(let i=0;i<12;i++) {
                const a = (Math.PI * 2 / 12) * i;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * 30, Math.sin(a) * 30);
                ctx.lineTo(Math.cos(a) * 40, Math.sin(a) * 40);
                ctx.stroke();
            }
        }

        else if(this.type.includes('water')) {
            for(let i=0;i<6;i++) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0,229,255,0.25)';
                ctx.lineWidth = 2;
                ctx.arc(0,0,this.size + i * 15 + pulse * 0.2,0,Math.PI*2);
                ctx.stroke();
            }
        }

        else if(this.type.includes('faceless')) {
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ffffff';

            ctx.beginPath();
            ctx.ellipse(0,0,60,90,0,0,Math.PI*2);
            ctx.fill();

            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(-12,-10,24,45);
        }

        else {
            ctx.strokeStyle = 'rgba(155,92,255,0.35)';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.rect(-this.size/2,-this.size/2,this.size,this.size);
            ctx.stroke();
        }

        ctx.restore();
    }
}

for(let i=0;i<140;i++) {
    particles.push(new Particle());
}

function emotionalPalette(emotion) {
    if(emotion === 'Anxiety') return ['#ff3b6b', '#ff8fab'];
    if(emotion === 'Melancholy') return ['#9b5cff', '#5d76ff'];
    if(emotion === 'Euphoria') return ['#ffe066', '#ff9f1c'];
    return ['#00e5ff', '#3ae374'];
}

function reconstructDream() {
    dreamObjects = [];

    const text = document.getElementById('narrative').value;
    const emotion = document.getElementById('emotion').value;
    const symbols = document.getElementById('symbols').value.split(',');

    const density = semanticDensity(symbols);
    const coherence = dreamCoherence(text, symbols);
    const archetype = inferArchetype(symbols, emotion);

    document.getElementById('density').innerText = density.toFixed(2);
    document.getElementById('coherence').innerText = coherence.toFixed(2);
    document.getElementById('archetype').innerText = archetype;

    const instability = Math.floor((1 - coherence) * 100);
    document.getElementById('instability').innerText = instability + '%';

    symbols.forEach(s => {
        dreamObjects.push(new DreamObject(s.trim().toLowerCase(), emotion));
    });

    generateAnalysis(text, emotion, archetype, density, coherence);
}

function generateAnalysis(text, emotion, archetype, density, coherence) {
    const output = document.getElementById('analysisText');

    let emotionalTone = '';

    if(emotion === 'Melancholy') {
        emotionalTone = 'Your subconscious appears to be reconstructing emotionally unresolved memory structures through symbolic isolation and deep spatial imagery.';
    }

    if(emotion === 'Anxiety') {
        emotionalTone = 'The dream architecture suggests heightened neural instability and recursive threat anticipation loops.';
    }

    if(emotion === 'Euphoria') {
        emotionalTone = 'The subconscious is dissolving perceptual boundaries and creating expansive symbolic fusion states.';
    }

    if(emotion === 'Serenity') {
        emotionalTone = 'The reconstruction indicates unusually coherent subconscious processing and stable emotional harmonics.';
    }

    output.innerHTML = `
        <b>Primary Archetype:</b> ${archetype}<br><br>
        <b>Semantic Density:</b> ${(density * 100).toFixed(0)}% symbolic compression detected.<br><br>
        <b>Dream Coherence:</b> ${(coherence * 100).toFixed(0)}% narrative continuity retention.<br><br>
        ${emotionalTone}<br><br>
        Repeating symbolic anchors inside the narrative suggest latent subconscious fixation patterns rather than random dream noise.
    `;
}

function render(t) {
    requestAnimationFrame(render);

    const emotion = document.getElementById('emotion').value;
    const palette = emotionalPalette(emotion);

    ctx.fillStyle = 'rgba(2,3,10,0.12)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const gradient = ctx.createRadialGradient(
        canvas.width/2,
        canvas.height/2,
        50,
        canvas.width/2,
        canvas.height/2,
        canvas.width
    );

    gradient.addColorStop(0, palette[0] + '22');
    gradient.addColorStop(1, '#02030a');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    fogOffset += 0.001;

    for(let y=0;y<canvas.height;y+=40) {
        ctx.fillStyle = `rgba(255,255,255,${0.01 + Math.sin(y * 0.01 + fogOffset) * 0.01})`;
        ctx.fillRect(0,y,canvas.width,40);
    }

    particles.forEach(p => p.update(palette[0]));

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    dreamObjects.forEach(o => o.draw(t));

    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';

    for(let i=0;i<20;i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * 80 + Math.sin(t * 0.0002 + i) * 30);
        ctx.lineTo(canvas.width, i * 80 + Math.cos(t * 0.0003 + i) * 30);
        ctx.stroke();
    }
}

reconstructDream();
render();
</script>

</body>
</html>
